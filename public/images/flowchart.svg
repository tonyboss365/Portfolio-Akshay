<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8faff"/>
      <stop offset="100%" style="stop-color:#eff2ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f5f6ff" rx="16"/>

  <!-- Title -->
  <rect x="20" y="16" width="760" height="44" rx="10" fill="url(#headerGrad)"/>
  <text x="400" y="44" text-anchor="middle" fill="white" font-size="17" font-weight="700" letter-spacing="1">APP FLOW — PORTFOLIO</text>

  <!-- NODE 1: Browser -->
  <rect x="320" y="88" width="160" height="50" rx="10" fill="url(#nodeGrad)" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="110" text-anchor="middle" fill="#4f46e5" font-size="12" font-weight="700">🌐 Browser</text>
  <text x="400" y="127" text-anchor="middle" fill="#6b7280" font-size="11">Visits portfolio URL</text>

  <!-- Arrow 1→2 -->
  <line x1="400" y1="138" x2="400" y2="162" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 2: Vite Static Server -->
  <rect x="290" y="163" width="220" height="50" rx="10" fill="url(#nodeGrad)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="185" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="700">⚡ Vite / CDN</text>
  <text x="400" y="202" text-anchor="middle" fill="#6b7280" font-size="11">Serves index.html + JS bundle</text>

  <!-- Arrow 2→3 -->
  <line x1="400" y1="213" x2="400" y2="237" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 3: React App Bootstrap -->
  <rect x="275" y="238" width="250" height="50" rx="10" fill="url(#nodeGrad)" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="260" text-anchor="middle" fill="#0ea5e9" font-size="12" font-weight="700">⚛️ React App Boots</text>
  <text x="400" y="277" text-anchor="middle" fill="#6b7280" font-size="11">main.tsx → App.tsx renders</text>

  <!-- Arrow 3→4a and 3→4b -->
  <line x1="330" y1="288" x2="200" y2="318" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="288" x2="600" y2="318" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 4a: Data layer -->
  <rect x="80" y="318" width="230" height="50" rx="10" fill="url(#nodeGrad)" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="340" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="700">📦 data.ts</text>
  <text x="195" y="357" text-anchor="middle" fill="#6b7280" font-size="11">Projects, skills, metadata</text>

  <!-- NODE 4b: Components -->
  <rect x="490" y="318" width="230" height="50" rx="10" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="605" y="340" text-anchor="middle" fill="#d97706" font-size="12" font-weight="700">🧩 Components</text>
  <text x="605" y="357" text-anchor="middle" fill="#6b7280" font-size="11">Hero, Projects, Skills, Contact</text>

  <!-- Arrow 4a/4b → 5 -->
  <line x1="195" y1="368" x2="350" y2="418" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="605" y1="368" x2="450" y2="418" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 5: Rendered UI -->
  <rect x="270" y="418" width="260" height="50" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="400" y="440" text-anchor="middle" fill="white" font-size="12" font-weight="700">✅ Rendered Portfolio UI</text>
  <text x="400" y="457" text-anchor="middle" fill="#c4b5fd" font-size="11">Theme toggle · Responsive layout</text>

  <!-- Legend -->
  <text x="30" y="490" fill="#9ca3af" font-size="10">✦ Akshay Kumar Reddy — Portfolio Flow</text>
</svg>
