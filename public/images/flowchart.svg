<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="700" height="520" fill="#f8f9ff" rx="12"/>

  <!-- Title bar -->
  <rect x="20" y="16" width="660" height="42" rx="8" fill="#4f46e5"/>
  <text x="350" y="43" text-anchor="middle" fill="white" font-size="15" font-weight="bold">APP FLOW — PORTFOLIO</text>

  <!-- Node 1: Browser -->
  <rect x="270" y="78" width="160" height="52" rx="8" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <text x="350" y="100" text-anchor="middle" fill="#4f46e5" font-size="12" font-weight="bold">Browser</text>
  <text x="350" y="118" text-anchor="middle" fill="#6b7280" font-size="11">Visits portfolio URL</text>

  <!-- Arrow 1 to 2 -->
  <line x1="350" y1="130" x2="350" y2="154" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="343,150 350,163 357,150" fill="#4f46e5"/>

  <!-- Node 2: CDN/Vite -->
  <rect x="250" y="163" width="200" height="52" rx="8" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="185" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="bold">Vite Build / CDN</text>
  <text x="350" y="203" text-anchor="middle" fill="#6b7280" font-size="11">Serves index.html + JS bundle</text>

  <!-- Arrow 2 to 3 -->
  <line x1="350" y1="215" x2="350" y2="239" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="343,235 350,248 357,235" fill="#4f46e5"/>

  <!-- Node 3: React -->
  <rect x="230" y="248" width="240" height="52" rx="8" fill="white" stroke="#0ea5e9" stroke-width="2"/>
  <text x="350" y="270" text-anchor="middle" fill="#0ea5e9" font-size="12" font-weight="bold">React App Boots</text>
  <text x="350" y="288" text-anchor="middle" fill="#6b7280" font-size="11">main.tsx → App.tsx renders</text>

  <!-- Arrow 3 to 4a (left) -->
  <line x1="300" y1="300" x2="185" y2="330" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="181,322 178,335 191,330" fill="#4f46e5"/>

  <!-- Arrow 3 to 4b (right) -->
  <line x1="400" y1="300" x2="515" y2="330" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="509,322 522,330 509,337" fill="#4f46e5"/>

  <!-- Node 4a: data.ts -->
  <rect x="60" y="334" width="210" height="52" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="356" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">data.ts</text>
  <text x="165" y="374" text-anchor="middle" fill="#6b7280" font-size="11">Projects, skills, metadata</text>

  <!-- Node 4b: Components -->
  <rect x="430" y="334" width="210" height="52" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="535" y="356" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">Components</text>
  <text x="535" y="374" text-anchor="middle" fill="#6b7280" font-size="11">Hero, Projects, Skills, Contact</text>

  <!-- Arrow 4a to 5 -->
  <line x1="165" y1="386" x2="295" y2="426" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="289,419 298,432 305,421" fill="#4f46e5"/>

  <!-- Arrow 4b to 5 -->
  <line x1="535" y1="386" x2="405" y2="426" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="395,421 402,432 411,420" fill="#4f46e5"/>

  <!-- Node 5: Final UI -->
  <rect x="210" y="434" width="280" height="52" rx="8" fill="#4f46e5"/>
  <text x="350" y="456" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Rendered Portfolio UI</text>
  <text x="350" y="474" text-anchor="middle" fill="#c4b5fd" font-size="11">Theme toggle · Responsive layout</text>

  <!-- Footer -->
  <text x="350" y="510" text-anchor="middle" fill="#9ca3af" font-size="10">Akshay Kumar Reddy — Portfolio Flow</text>

