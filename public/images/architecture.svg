<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="layerA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eef2ff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <linearGradient id="layerB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="layerC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed"/>
      <stop offset="100%" style="stop-color:#ffedd5"/>
    </linearGradient>
    <linearGradient id="layerD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf4ff"/>
      <stop offset="100%" style="stop-color:#fae8ff"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- BG -->
  <rect width="860" height="540" fill="#f8fafc" rx="16"/>

  <!-- Title bar -->
  <rect x="20" y="16" width="820" height="44" rx="10" fill="url(#hdr)"/>
  <text x="430" y="44" text-anchor="middle" fill="white" font-size="17" font-weight="700" letter-spacing="1">COMPONENT ARCHITECTURE — PORTFOLIO</text>

  <!-- ── LAYER 1: Presentation ── -->
  <rect x="30" y="80" width="800" height="100" rx="10" fill="url(#layerA)" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="100" fill="#4f46e5" font-size="11" font-weight="700">① PRESENTATION LAYER</text>

  <!-- Boxes in layer 1 -->
  <rect x="50"  y="108" width="110" height="54" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="105" y="131" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">Hero</text>
  <text x="105" y="149" text-anchor="middle" fill="#9ca3af" font-size="10">Intro · CTA</text>

  <rect x="178" y="108" width="110" height="54" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="233" y="131" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">Projects</text>
  <text x="233" y="149" text-anchor="middle" fill="#9ca3af" font-size="10">Cards · Links</text>

  <rect x="306" y="108" width="110" height="54" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="361" y="131" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">Skills</text>
  <text x="361" y="149" text-anchor="middle" fill="#9ca3af" font-size="10">Badges · List</text>

  <rect x="434" y="108" width="110" height="54" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="489" y="131" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">About</text>
  <text x="489" y="149" text-anchor="middle" fill="#9ca3af" font-size="10">Bio · Photo</text>

  <rect x="562" y="108" width="110" height="54" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="617" y="131" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">Contact</text>
  <text x="617" y="149" text-anchor="middle" fill="#9ca3af" font-size="10">Form · Socials</text>

  <rect x="690" y="108" width="120" height="54" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="750" y="131" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="700">ThemeToggle</text>
  <text x="750" y="149" text-anchor="middle" fill="#9ca3af" font-size="10">Dark / Light</text>

  <!-- Arrow layer 1 → 2 -->
  <line x1="430" y1="180" x2="430" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 2: App Root ── -->
  <rect x="30" y="205" width="800" height="72" rx="10" fill="url(#layerB)" stroke="#22c55e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="225" fill="#16a34a" font-size="11" font-weight="700">② APP ROOT</text>
  <rect x="50"  y="232" width="180" height="36" rx="8" fill="white" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="255" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="700">App.tsx — Router + Layout</text>
  <rect x="250" y="232" width="160" height="36" rx="8" fill="white" stroke="#22c55e" stroke-width="1.5"/>
  <text x="330" y="255" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="700">main.tsx — React root</text>
  <rect x="430" y="232" width="160" height="36" rx="8" fill="white" stroke="#22c55e" stroke-width="1.5"/>
  <text x="510" y="255" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="700">ThemeContext (global)</text>
  <rect x="610" y="232" width="200" height="36" rx="8" fill="white" stroke="#22c55e" stroke-width="1.5"/>
  <text x="710" y="255" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="700">CSS variables + styles</text>

  <!-- Arrow 2 → 3 -->
  <line x1="430" y1="277" x2="430" y2="301" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 3: Data ── -->
  <rect x="30" y="302" width="800" height="72" rx="10" fill="url(#layerC)" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="322" fill="#d97706" font-size="11" font-weight="700">③ DATA LAYER</text>
  <rect x="50"  y="329" width="210" height="36" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="155" y="352" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">data.ts — projects, skills, info</text>
  <rect x="280" y="329" width="180" height="36" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="352" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">public/ — images, assets</text>
  <rect x="480" y="329" width="330" height="36" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="645" y="352" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">Static (no API / no DB needed)</text>

  <!-- Arrow 3 → 4 -->
  <line x1="430" y1="374" x2="430" y2="398" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 4: Build & Deploy ── -->
  <rect x="30" y="399" width="800" height="72" rx="10" fill="url(#layerD)" stroke="#a855f7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="419" fill="#9333ea" font-size="11" font-weight="700">④ BUILD &amp; DEPLOY</text>
  <rect x="50"  y="426" width="150" height="36" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="125" y="449" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="700">Vite build</text>
  <rect x="220" y="426" width="150" height="36" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="295" y="449" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="700">dist/ (static)</text>
  <rect x="390" y="426" width="150" height="36" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="465" y="449" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="700">Vercel / Netlify</text>
  <rect x="560" y="426" width="150" height="36" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="635" y="449" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="700">GitHub Pages</text>

  <!-- Footer -->
  <text x="430" y="525" text-anchor="middle" fill="#94a3b8" font-size="10">✦ Akshay Kumar Reddy — Component Architecture</text>
</svg>
