<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9ff" rx="12"/>

  <!-- Title bar -->
  <rect x="20" y="16" width="760" height="42" rx="8" fill="#4f46e5"/>
