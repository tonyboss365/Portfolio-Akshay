  <text x="93"  y="143" text-anchor="middle" fill="#9ca3af" font-size="10">Intro · CTA</text>

  <rect x="153" y="103" width="98" height="52" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="202" y="126" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="bold">Projects</text>
  <text x="202" y="143" text-anchor="middle" fill="#9ca3af" font-size="10">Cards · Links</text>

  <rect x="262" y="103" width="98" height="52" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="311" y="126" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="bold">Skills</text>
