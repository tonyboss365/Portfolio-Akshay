  <text x="420" y="126" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="bold">About</text>
  <text x="420" y="143" text-anchor="middle" fill="#9ca3af" font-size="10">Bio · Photo</text>

  <rect x="480" y="103" width="98" height="52" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="529" y="126" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="bold">Contact</text>
  <text x="529" y="143" text-anchor="middle" fill="#9ca3af" font-size="10">Form · Socials</text>

  <rect x="589" y="103" width="162" height="52" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <text x="670" y="126" text-anchor="middle" fill="#4f46e5" font-size="11" font-weight="bold">ThemeToggle</text>
  <text x="670" y="143" text-anchor="middle" fill="#9ca3af" font-size="10">Dark / Light mode</text>

