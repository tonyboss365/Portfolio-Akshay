  <text x="611" y="355" text-anchor="middle" fill="#d97706" font-size="11" font-weight="bold">Static only — no API / no DB</text>

  <!-- Arrow 3 to 4 -->
  <line x1="400" y1="380" x2="400" y2="400" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="393,396 400,409 407,396" fill="#94a3b8"/>

