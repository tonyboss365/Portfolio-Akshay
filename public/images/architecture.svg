  <text x="121" y="457" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="bold">npm run build</text>

  <rect x="212" y="435" width="154" height="36" rx="6" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="289" y="457" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="bold">dist/ (static files)</text>

  <rect x="380" y="435" width="154" height="36" rx="6" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="457" y="457" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="bold">Vercel / Netlify</text>

  <rect x="548" y="435" width="202" height="36" rx="6" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="649" y="457" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="bold">GitHub Pages</text>

  <!-- Footer -->
  <text x="400" y="492" text-anchor="middle" fill="#9ca3af" font-size="10">Akshay Kumar Reddy — Component Architecture</text>

</svg>
